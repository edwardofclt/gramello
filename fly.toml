# fly.toml app configuration file generated for nourish-api on 2026-09-22T21:01:28Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "nourish-api"
primary_region = 'iad'
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  APP_BASE_URL = "https://nourish-api.fly.dev"
  # Set matching Fly secrets to enable native bearer-token authentication.
  AUTH0_AUDIENCE = ""
  AUTH0_MOBILE_CLIENT_ID = ""

# The container's SQLite database and migration markers must survive deploys.
# Keep one Machine: these volumes do not replicate between Machines.

[[mounts]]
  source = "nourish_data"
  destination = "/data"
  initial_size = "1gb"
  snapshot_retention = 14

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  checks = [{ grace_period = '1m0s', interval = '30s', method = 'GET', path = '/', timeout = '5s' }]

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '512mb'

[deploy]
  strategy = 'immediate'
