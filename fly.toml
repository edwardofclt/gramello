app = "nourish-api"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  APP_BASE_URL = "https://nourish-api.fly.dev"

# The container's SQLite database and migration markers must survive deploys.
# Keep one Machine: these volumes do not replicate between Machines.
[[mounts]]
  source = "nourish_data"
  destination = "/data"
  initial_size = "1gb"
  snapshot_retention = 14

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
