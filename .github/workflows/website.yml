name: Gramello website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/privacy.md'
      - 'docs/support.md'
      - 'docs/terms.md'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/privacy.md'
      - 'docs/support.md'
      - 'docs/terms.md'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node website/build.mjs
      - run: node website/check.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/website

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
