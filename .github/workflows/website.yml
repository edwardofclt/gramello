name: Gramello website

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
  release:
    types: [published]
  pull_request:
    paths:
      - 'website/**'
      - 'docs/privacy.md'
      - 'docs/support.md'
      - 'docs/terms.md'
      - '.github/workflows/website.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable release tag to check for website changes
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
    steps:
      - name: Verify published stable release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable release tag like v1.8.0."
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then error("A published stable release is required") else "Verified stable release" end'
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG && format('refs/tags/{0}', env.RELEASE_TAG) || github.sha }}
          fetch-depth: 0
      - name: Check for website changes since the previous stable release
        id: changes
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_tag=''
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            tags="$(git tag --merged HEAD^ --sort=-version:refname)"
            while IFS= read -r tag; do
              if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                previous_tag="$tag"
                break
              fi
            done <<< "$tags"
          fi

          if [[ -z "$previous_tag" ]]; then
            echo 'No previous stable release; publishing the website.'
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$previous_tag" HEAD -- \
            website docs/privacy.md docs/support.md docs/terms.md \
            .github/workflows/website.yml .github/workflows/release.yml; then
            echo "Website unchanged since $previous_tag; skipping publication."
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" -ne 1 ]]; then
              exit "$status"
            fi
            echo "Website changed since $previous_tag; publishing this release."
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: 24
      - run: node website/build.mjs
        if: steps.changes.outputs.changed == 'true'
      - run: node website/check.mjs
        if: steps.changes.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.changes.outputs.changed == 'true'
        with:
          path: out/website

  deploy:
    if: needs.build.outputs.changed == 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'release')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
