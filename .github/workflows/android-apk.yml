name: Android APK

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      EXPO_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to build (for example v1.8.0)
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: android-apk-${{ inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable release tag like v1.8.0."
            exit 1
          fi
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then error("A published stable release is required") else "Verified stable release" end'
      - name: Check Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Set the EXPO_TOKEN repository secret before building Android APKs."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Set app version from release tag
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'mobile/package.json';
          const pkg = JSON.parse(readFileSync(path, 'utf8'));
          pkg.version = process.env.RELEASE_TAG.slice(1);
          writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          console.log(`Building Android version ${pkg.version} from ${process.env.RELEASE_TAG}`);
          NODE
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gramello/mobile typecheck
      - name: Set up Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: 24.7.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build signed APK on EAS
        working-directory: mobile
        run: |
          eas build --platform android --profile production-apk --non-interactive --wait --json \
            --message "GitHub release $RELEASE_TAG" > "$RUNNER_TEMP/android-build.json"
      - name: Download and verify APK
        run: |
          apk_url=$(jq -er '
            if type != "array" or length != 1 then error("Expected one Android build")
            elif .[0].platform != "ANDROID" or .[0].status != "FINISHED" then error("Android build did not finish successfully")
            else .[0].artifacts.applicationArchiveUrl // .[0].artifacts.buildUrl // empty
            end | select(type == "string" and startswith("https://"))
          ' "$RUNNER_TEMP/android-build.json")
          mkdir -p "$RUNNER_TEMP/android-release"
          apk_path="$RUNNER_TEMP/android-release/gramello-$RELEASE_TAG.apk"
          curl --fail --location --silent --show-error --retry 3 \
            --connect-timeout 30 --max-time 600 --proto '=https' --proto-redir '=https' \
            --output "$apk_path" "$apk_url"
          unzip -tq "$apk_path"
          # APKs contain a root manifest; Android App Bundles do not.
          unzip -p "$apk_path" AndroidManifest.xml > "$RUNNER_TEMP/android-manifest.xml"
          test -s "$RUNNER_TEMP/android-manifest.xml"
      - name: Attach APK to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/android-release/gramello-$RELEASE_TAG.apk" --clobber
