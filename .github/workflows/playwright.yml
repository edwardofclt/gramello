name: Playwright
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'components/**', 'hooks/**', 'lib/**', 'db/**', 'drizzle/**', 'tests/e2e/**', 'playwright.config.ts', 'package.json', 'pnpm-lock.yaml', '.github/workflows/playwright.yml']
  pull_request:
    paths: ['app/**', 'components/**', 'hooks/**', 'lib/**', 'db/**', 'drizzle/**', 'tests/e2e/**', 'playwright.config.ts', 'package.json', 'pnpm-lock.yaml', '.github/workflows/playwright.yml']
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build current checkout
        run: pnpm build
      - name: Test with disposable authenticated Worker
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
