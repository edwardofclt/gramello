name: TestFlight

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      EXPO_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to build (for example v1.2.0)
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: testflight-ios-${{ inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-and-submit:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
    steps:
      - name: Check Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Set the EXPO_TOKEN repository secret before building for TestFlight."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Verify published release and set app version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then error("A published stable release is required") else "Verified stable release" end'
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Expected a stable release tag like v1.2.0');
          const path = 'mobile/package.json';
          const pkg = JSON.parse(readFileSync(path, 'utf8'));
          pkg.version = tag.slice(1);
          writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          console.log(`Building iOS version ${pkg.version} from ${tag}`);
          NODE
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gramello/mobile typecheck
      - name: Set up Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: 24.7.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build and submit to TestFlight
        working-directory: mobile
        run: eas build --platform ios --profile production --auto-submit --non-interactive --wait --message "GitHub release $RELEASE_TAG"
