name: Publish US branded food packs

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: food-catalog
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OFF_REVISION: 5ac8dbc2a2b1978924686e11798fe136eb13902a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install import dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          python -m pip install -r scripts/food-packs-requirements.txt
      - name: Test source extraction and importer
        run: |
          python -m unittest discover -s scripts/tests -p 'test_food_pack*.py'
          pnpm test tests/branded-catalog.test.ts tests/catalog-packs.test.ts tests/browser-packs.test.ts tests/catalog-pack-relay.test.ts
      - name: Make room for source snapshots and cache archives
        run: |
          # This data job does not build Android, .NET, or Haskell applications.
          # OFF's full Parquet snapshot is about 7.9 GB, before cache packaging.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h .
      - name: Restore pinned source downloads
        id: sources
        uses: actions/cache/restore@v4
        with:
          path: |
            .catalog-work/raw/*.zip
            .catalog-work/raw/*.parquet
          key: food-pack-sources-usda-2026-04-30-off-${{ env.OFF_REVISION }}
      - name: Download source snapshots with progress
        run: python -u scripts/extract-food-packs.py .catalog-work/raw --off-revision "$OFF_REVISION" --download-only
      - name: Save downloads before starting extraction
        if: steps.sources.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .catalog-work/raw/*.zip
            .catalog-work/raw/*.parquet
          key: food-pack-sources-usda-2026-04-30-off-${{ env.OFF_REVISION }}
      - name: Extract both official datasets and build signed source packs
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$CATALOG_SIGNING_KEY"
          python -u scripts/extract-food-packs.py .catalog-work/raw --off-revision "$OFF_REVISION"
          node scripts/food-packs.mjs .catalog-work/raw/usda.jsonl .catalog-work/raw/off.jsonl \
            catalog-release "https://github.com/${REPOSITORY}/releases/download/food-catalog/"
          node scripts/verify-food-packs.mjs catalog-release
          cp docs/food-packs.md catalog-release/PACK-SOURCES.md
          cp .catalog-work/raw/provenance.json catalog-release/PACK-PROVENANCE.json
          cp scripts/extract-food-packs.py scripts/food-packs.mjs scripts/food-catalog.mjs scripts/verify-food-packs.mjs \
            scripts/food-packs-requirements.txt lib/catalog-import.ts catalog-release/
      - name: Publish immutable pack assets before advertising the manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view food-catalog >/dev/null 2>&1; then
            gh release create food-catalog --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Food catalog data" --notes "USDA and separately licensed Open Food Facts US product packs. See PACK-SOURCES.md for attribution and source obligations."
          fi
          existing_assets="$(gh release view food-catalog --json assets --jq '.assets[].name')"
          for file in catalog-release/*.sqlite; do
            asset="$(basename "$file")"
            if ! grep -Fx "$asset" <<< "$existing_assets" >/dev/null; then
              gh release upload food-catalog "$file"
            fi
          done
          gh release upload food-catalog catalog-release/PACK-SOURCES.md catalog-release/PACK-PROVENANCE.json \
            catalog-release/import-report.json catalog-release/extract-food-packs.py catalog-release/food-packs.mjs \
            catalog-release/food-catalog.mjs catalog-release/verify-food-packs.mjs catalog-release/verification-report.json \
            catalog-release/food-packs-requirements.txt catalog-release/catalog-import.ts --clobber
          gh release upload food-catalog catalog-release/pack-manifest.json --clobber
