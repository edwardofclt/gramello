name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.release.outputs.new_release_published }}
      tag: ${{ steps.release.outputs.new_release_git_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create semantic release
        id: release
        run: |
          node --input-type=module <<'NODE'
          import semanticRelease from 'semantic-release';
          import { appendFileSync } from 'node:fs';

          const result = await semanticRelease();
          appendFileSync(process.env.GITHUB_OUTPUT, `new_release_published=${Boolean(result)}\n`);
          if (result) {
            appendFileSync(process.env.GITHUB_OUTPUT, `new_release_git_tag=${result.nextRelease.gitTag}\n`);
          }
          NODE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-website:
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/website.yml
    with:
      release_tag: ${{ needs.release.outputs.tag }}

  android-store:
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/android-store.yml
    with:
      release_tag: ${{ needs.release.outputs.tag }}
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  testflight:
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/testflight.yml
    with:
      release_tag: ${{ needs.release.outputs.tag }}
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
