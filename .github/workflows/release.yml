name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.release.outputs.new_release_published }}
      version: ${{ steps.release.outputs.new_release_version }}
      tag: ${{ steps.release.outputs.new_release_git_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create semantic release
        id: release
        run: |
          node --input-type=module <<'NODE'
          import semanticRelease from 'semantic-release';
          import { appendFileSync } from 'node:fs';

          const result = await semanticRelease();
          appendFileSync(process.env.GITHUB_OUTPUT, `new_release_published=${Boolean(result)}\n`);
          if (result) {
            appendFileSync(process.env.GITHUB_OUTPUT, `new_release_version=${result.nextRelease.version}\nnew_release_git_tag=${result.nextRelease.gitTag}\n`);
          }
          NODE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-website:
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/website.yml
    with:
      release_tag: ${{ needs.release.outputs.tag }}

  publish-image:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ needs.release.outputs.version }}
          platforms: linux/amd64,linux/arm64

  android-apk:
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/android-apk.yml
    with:
      release_tag: ${{ needs.release.outputs.tag }}
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  testflight:
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/testflight.yml
    with:
      release_tag: ${{ needs.release.outputs.tag }}
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
